[package]
name = "mimir"
version = "1.0.0"
description = "Mimir Trading Dashboard"
authors = ["Mimir"]
edition = "2021"

[lib]
name = "mimir_lib"
# `cdylib` is a MOBILE-only target: it must export every symbol so the mobile
# runtime can resolve them. On desktop that pushes the export table past PE's
# 65535-ordinal cap and the link fails with "too many exported symbols
# (got 95528, max 65535)" / "export ordinal too large". The desktop binary
# links the plain `lib` (rlib) target instead, so nothing is lost here.
crate-type = ["lib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
